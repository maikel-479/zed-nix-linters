id = "nix-linters"
name = "Nix Linters"
version = "0.3.0"
schema_version = 1
authors = ["maikel"]
description = "Nix language support with LSP, linting (statix, deadnix) and formatting (nixfmt, alejandra)."
repository = "https://github.com/maikel-479/zed-nix-linters"
languages = ["languages/nix"]
snippets = ["./snippets/nix.json"]

[lib]
kind = "Rust"
version = "0.7.0"

[grammars.nix]
repository = "https://github.com/nix-community/tree-sitter-nix"
rev = "ea1d87f7996be1329ef6555dcacfa63a69bd55c6"

[language_servers.nix-lint]
languages = ["Nix"]
code_action_kinds = ["source.fixAll.statix", "source.fixAll.deadnix"]

[language_servers.nixd]
languages = ["Nix"]

[language_servers.nil]
languages = ["Nix"]
# nil only starts when the user explicitly lists it in their
# `language_servers` setting — nixd is the default Nix language server.
opt_in_languages = ["Nix"]
